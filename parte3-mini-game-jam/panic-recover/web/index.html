<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Panic Recover: Runtime Defender - GopherCon LATAM 2026</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #060913;
      color: #9feaf9;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 35px rgba(0, 200, 255, 0.3), 0 0 10px rgba(255, 60, 60, 0.2);
      border: 2px solid #1a3250;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #090e1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.5s ease;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #16263d;
      border-top: 4px solid #00d2ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #footer-instructions {
      margin-top: 15px;
      font-size: 13px;
      color: #5c7f9d;
      text-align: center;
      line-height: 1.5;
    }
    .highlight {
      color: #00d2ff;
      font-weight: bold;
    }
    .panic {
      color: #ff4757;
      font-weight: bold;
    }
    .recover {
      color: #2ed573;
      font-weight: bold;
    }
  </style>
  <script src="wasm_exec.js"></script>
</head>
<body>
  <div id="game-container">
    <div id="loading-overlay">
      <div class="spinner"></div>
      <h2 style="color: #00d2ff; margin-bottom: 8px;">LOADING RUNTIME...</h2>
      <p style="color: #6388a6; font-size: 13px;">Preparing Gopher Vanguard systems</p>
    </div>
  </div>

  <div id="footer-instructions">
    <p><span class="highlight">WASD / Arrow Keys</span>: Move &bull; <span class="highlight">Space / J</span>: Fire &bull; <span class="recover">K / E / Right Click</span>: Deploy Recover &bull; <span class="highlight">F11</span>: Fullscreen</p>
    <p style="margin-top: 4px;"><span class="panic">PANIC SURGE</span>: Taking lethal damage triggers 5s overdrive! Destroy bugs for <span class="recover">recover()</span> drops before stack unwinds!</p>
  </div>

  <script>
    if (!WebAssembly.instantiateStreaming) {
      WebAssembly.instantiateStreaming = async (resp, importObject) => {
        const source = await (await resp).arrayBuffer();
        return await WebAssembly.instantiate(source, importObject);
      };
    }

    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("game.wasm"), go.importObject).then(result => {
      document.getElementById("loading-overlay").style.opacity = '0';
      setTimeout(() => {
        document.getElementById("loading-overlay").style.display = 'none';
      }, 500);
      go.run(result.instance);
    }).catch(err => {
      console.error("WASM instantiation error:", err);
      document.getElementById("loading-overlay").innerHTML = 
        `<h3 style="color:#ff4757;">Failed to load WebAssembly binary</h3><p style="margin-top:8px;font-size:12px;color:#aaa;">${err.message}</p>`;
    });
  </script>
</body>
</html>
